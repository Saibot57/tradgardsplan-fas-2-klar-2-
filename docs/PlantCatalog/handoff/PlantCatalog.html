    :root {
      /* Paper & ink */
      --paper-50:  #FBF8F2;
      --paper-100: #F4EFE6;
      --paper-200: #ECE5D4;
      --paper-300: #D8D1C0;
      --paper-400: #B8B19E;
      --paper-500: #8E8775;
      --ink-900:   #1F2419;
      --ink-700:   #2F3527;
      --ink-500:   #5B5C50;
      --ink-400:   #7D7E70;
      --ink-300:   #9C9D8E;

      /* Soil — terracotta */
      --soil-100: #F2DDD0; --soil-300: #DA9776; --soil-500: #B5562E; --soil-700: #8C3F1F; --soil-900: #5C2914;
      /* Bed — sage */
      --bed-100: #DDE5D2; --bed-300: #A6BB8E; --bed-500: #6E8C5A; --bed-700: #4F6B3E; --bed-900: #2E4022;
      /* Sun — ochre */
      --sun-100: #F3E2B7; --sun-300: #E2BF74; --sun-500: #D4A24C; --sun-700: #A87C2A; --sun-900: #6B4D15;
      /* Sky — slate blue */
      --sky-100: #D9E2E8; --sky-300: #9DB3BF; --sky-500: #6B8A9E; --sky-700: #46647A; --sky-900: #233846;
      /* Wall — warm grey */
      --wall-100: #E4DFD7; --wall-300: #B6AEA2; --wall-500: #8C8478; --wall-700: #5F5849; --wall-900: #322D24;

      --danger-100: #F4D9D2; --danger-500: #B23A2A; --danger-700: #80261B;
      --success-100: #DCE6CF; --success-500: #4F7A3F; --success-700: #34552A;

      /* Surfaces */
      --bg-paper:   var(--paper-100);
      --bg-surface: var(--paper-50);
      --bg-hover:   var(--paper-200);
      --bg-canvas:  #ECE5D4;
      --line-1: var(--paper-300);
      --line-2: var(--paper-400);

      --ink-1: var(--ink-900);
      --ink-2: var(--ink-500);
      --ink-3: var(--ink-400);
      --ink-disabled: var(--paper-400);

      --accent-soil: var(--soil-500);
      --accent-bed:  var(--bed-500);
      --accent-sun:  var(--sun-500);
      --accent-sky:  var(--sky-500);
      --accent-wall: var(--wall-500);

      --state-danger:  var(--danger-500);
      --state-success: var(--success-500);

      --button-bg: var(--ink-900);
      --button-fg: var(--paper-50);
      --button-bg-hover: var(--ink-700);
      --button-bg-press: #14180F;
      --button-secondary-bg: var(--paper-50);
      --button-secondary-fg: var(--ink-900);
      --button-secondary-border: var(--paper-300);
      --button-secondary-bg-hover: var(--paper-200);

      --font-sans:    "Cabin", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;

      --text-lg: 21px; --text-xl: 28px; --text-2xl: 38px; --text-3xl: 52px; --text-4xl: 72px;

  <style>
    html, body, #root { height: 100%; margin: 0; }
    body {
      background: var(--bg-paper);
      color: var(--ink-1);
      font-family: var(--font-sans);
      font-size: 15px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    *, *::before, *::after { box-sizing: border-box; }

    /* Hover lift + press translate — drafting-tool feel */
    button { transition: background 120ms cubic-bezier(0.2,0.6,0.2,1), transform 60ms; }
    button:hover:not(:disabled) { filter: brightness(0.97); }
    button:active:not(:disabled) { transform: translateY(0.5px); }

    /* Sun-ochre focus ring */
    *:focus-visible {
      outline: 2px solid var(--accent-sun);
      outline-offset: 2px;
      border-radius: 4px;
    }

    /* Subtle scrollbars */
    *::-webkit-scrollbar { width: 10px; height: 10px; }
    *::-webkit-scrollbar-track { background: transparent; }
    *::-webkit-scrollbar-thumb {
      background: var(--line-1);
      border-radius: 999px;
      border: 2px solid transparent;
      background-clip: padding-box;
    }
    *::-webkit-scrollbar-thumb:hover { background-color: var(--line-2); }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>

  <script type="text/babel" data-presets="react" data-source="ui">
// PlantCatalog — shared UI primitives. Mirrors the style language of the
// existing SidePanel.tsx / Toolbar.tsx in geometry-sandbox (inline styles,
// CSS variables, tabular-nums numerics).

const { useState: pcUseState, useEffect: pcUseEffect, useRef: pcUseRef, useMemo: pcUseMemo } = React;

// ─── Button ────────────────────────────────────────────────────
function PCButton({ variant = "secondary", size = "md", iconOnly, disabled, onClick, title, children, style, type = "button" }) {
  const h = size === "sm" ? 26 : 32;
  const padX = iconOnly ? (size === "sm" ? 6 : 8) : (size === "sm" ? 10 : 12);
  const base = {
    fontFamily: "var(--font-sans)",
    fontSize: size === "sm" ? 12.5 : 13,
    fontWeight: 500,
    height: h,
    padding: `0 ${padX}px`,
    borderRadius: 4,
    border: "1px solid transparent",
    cursor: disabled ? "default" : "pointer",
    display: "inline-flex",
    alignItems: "center",
    justifyContent: "center",
    gap: 6,
    lineHeight: 1,
    transition: "background 120ms cubic-bezier(0.2,0.6,0.2,1), border-color 120ms",
    opacity: disabled ? 0.45 : 1,
    whiteSpace: "nowrap",
    ...style,
  };
  const variants = {
    primary:   { background: "var(--button-bg)", color: "var(--button-fg)" },
    secondary: { background: "var(--button-secondary-bg)", color: "var(--button-secondary-fg)", borderColor: "var(--button-secondary-border)" },
    ghost:     { background: "transparent", color: "var(--ink-1)" },
    accent:    { background: "var(--accent-bed)", color: "#FBF8F2", fontWeight: 600 },
    danger:    { background: "var(--state-danger)", color: "#FBF8F2" },
  };
  return (
    <button type={type} title={title} disabled={disabled} onClick={onClick} style={{ ...base, ...variants[variant] }}>
      {children}
    </button>
  );
}

// ─── Section label (inspector-style small caps) ────────────────
function PCSectionTitle({ icon, children, action }) {
  return (
    <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 8, gap: 8 }}>
      <div style={{
        display: "inline-flex", alignItems: "center", gap: 7,
        fontSize: 11.5, color: "var(--ink-2)",
        textTransform: "uppercase", letterSpacing: "0.08em", fontWeight: 500,
      }}>
        {icon ? <span style={{ display: "inline-flex", color: "var(--ink-2)" }}>{icon}</span> : null}
        {children}
      </div>
      {action}
    </div>
  );
}

// ─── Row: label left, value right (mono numerics) ──────────────
function PCRow({ label, value, mono = true }) {
  return (
    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", gap: 12, padding: "5px 0" }}>
      <div style={{ fontSize: 12.5, color: "var(--ink-2)", flexShrink: 0 }}>{label}</div>
      <div style={{
        fontFamily: mono ? "var(--font-mono)" : "var(--font-sans)",
        fontSize: 13,
        color: "var(--ink-1)",
        fontVariantNumeric: "tabular-nums",
        textAlign: "right",
        lineHeight: 1.45,
      }}>{value}</div>
    </div>
  );
}

// ─── Chip (filter toggle) ──────────────────────────────────────
function PCChip({ active, onClick, children, size = "md", style }) {
  const h = size === "sm" ? 24 : 28;
  return (
    <button
      onClick={onClick}
      style={{
        height: h,
        padding: "0 12px",
        borderRadius: 999,
        border: active ? "1px solid var(--accent-bed)" : "1px solid var(--line-1)",
        background: active ? "var(--bed-100)" : "var(--bg-surface)",
        color: active ? "var(--bed-700)" : "var(--ink-1)",
        fontFamily: "var(--font-sans)",
        fontSize: 12.5,
        fontWeight: active ? 600 : 500,
        cursor: "pointer",
        display: "inline-flex",
        alignItems: "center",
        gap: 6,
        whiteSpace: "nowrap",
        transition: "background 120ms cubic-bezier(0.2,0.6,0.2,1), border-color 120ms",
        ...style,
      }}
    >
      {children}
    </button>
  );
}

// ─── Category badge (small pill) ───────────────────────────────
function PCCategoryBadge({ category, size = "md" }) {
  const tint = window.PC_CATEGORY_TINT[category] || window.PC_CATEGORY_TINT.vegetable;
  const label = window.PC_CATEGORY_LABELS[category] || category;
  const h = size === "sm" ? 18 : 22;
  return (
    <span style={{
      height: h,
      padding: size === "sm" ? "0 6px" : "0 8px",
      borderRadius: 999,
      background: tint.bg,

      {label}

}

// ─── Range bar ──────────────────────────────────────────────────
// Segmented track: muted out-of-range / accent in-range. min/max labels
// in mono below. Same drafting-table feel as the canvas dimension labels.
function PCRangeBar({ min, max, scaleMin, scaleMax, unit, format = (n) => window.fmtInt(n), accent = "var(--accent-bed)" }) {
  const span = scaleMax - scaleMin;
  const leftPct = Math.max(0, ((min - scaleMin) / span) * 100);
  const rightPct = Math.min(100, ((max - scaleMin) / span) * 100);
  const widthPct = Math.max(2, rightPct - leftPct);

  // 5 tick stops for the muted track gradient
  return (
    <div style={{ marginTop: 6, marginBottom: 4 }}>
      {/* Scale labels — anchor + range */}
      <div style={{
        display: "flex", justifyContent: "space-between",
        fontFamily: "var(--font-mono)", fontSize: 10.5, color: "var(--ink-3)",
        marginBottom: 4, fontVariantNumeric: "tabular-nums",
      }}>
        <span>{format(scaleMin)}{unit ? <span style={{ marginLeft: 1 }}>{unit}</span> : null}</span>
        <span>{format(scaleMax)}{unit ? <span style={{ marginLeft: 1 }}>{unit}</span> : null}</span>
      </div>

      {/* Track */}
      <div style={{ position: "relative", height: 12 }}>
        {/* Out-of-range muted track */}
        <div style={{
          position: "absolute", left: 0, right: 0, top: 4, height: 4,
          background: "var(--line-1)",
          borderRadius: 2,
        }}/>
        {/* In-range accent */}
        <div style={{
          position: "absolute", left: `${leftPct}%`, width: `${widthPct}%`, top: 3, height: 6,
          background: accent,
          borderRadius: 2,
        }}/>
        {/* Tick marks at boundaries */}
        <div style={{
          position: "absolute", left: `${leftPct}%`, top: 0, width: 1, height: 12,
          background: "var(--ink-1)", transform: "translateX(-0.5px)",
        }}/>
        <div style={{
          position: "absolute", left: `${rightPct}%`, top: 0, width: 1, height: 12,
          background: "var(--ink-1)", transform: "translateX(-0.5px)",
        }}/>
      </div>

      {/* Min/Max numeric labels under the ticks */}
      <div style={{ position: "relative", height: 16, marginTop: 2 }}>
        <span style={{
          position: "absolute", left: `${leftPct}%`, transform: "translateX(-50%)",
          fontFamily: "var(--font-mono)", fontSize: 11, color: "var(--ink-1)",
          fontVariantNumeric: "tabular-nums",
        }}>{format(min)}</span>
        <span style={{
          position: "absolute", left: `${rightPct}%`, transform: "translateX(-50%)",
          fontFamily: "var(--font-mono)", fontSize: 11, color: "var(--ink-1)",
          fontVariantNumeric: "tabular-nums",
        }}>{format(max)}</span>
      </div>
    </div>
  );
}

// ─── Plant thumbnail (placeholder w/ category icon) ────────────
// No real photos available, so we render a tinted card with the Lucide
// category icon. Looks intentional, on-brand, and reads at any size.
function PCPlantThumb({ plant, size = 64, rounded = 8, big }) {
  const tint = window.PC_CATEGORY_TINT[plant.category] || window.PC_CATEGORY_TINT.vegetable;
  // Use bg-tint as background, dot/fg as foreground icon
  return (
    <div style={{
      width: size, height: size,
      flexShrink: 0,
      borderRadius: rounded,
      background: tint.bg,
      color: tint.fg,
      display: "flex", alignItems: "center", justifyContent: "center",
      border: "1px solid var(--line-1)",
      position: "relative",
      overflow: "hidden",
    }}>
      {/* Subtle radial vignette to hint at "paper card" depth */}
      <div style={{
        position: "absolute", inset: 0,
        background: "radial-gradient(circle at 30% 25%, rgba(255,255,255,0.5), transparent 60%)",
        pointerEvents: "none",
      }}/>
      <div style={{ position: "relative" }}>
        {window.categoryIcon(plant.category, Math.round(size * (big ? 0.55 : 0.5)))}
      </div>
    </div>
  );
}

// ─── Tab bar ───────────────────────────────────────────────────
function PCTabBar({ tabs, value, onChange }) {
  return (
    <div style={{
      display: "flex",
      alignItems: "stretch",
      height: "100%",
      gap: 0,
    }}>
      {tabs.map((t) => {
        const active = t.id === value;
        return (
          <button
            key={t.id}
            onClick={() => onChange(t.id)}
            style={{
              position: "relative",
              height: "100%",
              padding: "0 16px",
              border: "none",
              background: "transparent",
              color: active ? "var(--ink-1)" : "var(--ink-2)",
              fontFamily: "var(--font-sans)",
              fontSize: 13.5,
              fontWeight: active ? 600 : 500,
              cursor: "pointer",
              display: "inline-flex",
              alignItems: "center",
              gap: 7,
              letterSpacing: "0.005em",
              transition: "color 120ms cubic-bezier(0.2,0.6,0.2,1)",
            }}
          >
            {t.icon ? <span style={{ display: "inline-flex" }}>{t.icon}</span> : null}
            {t.label}
            {/* Active underline */}
            <span style={{
              position: "absolute", left: 12, right: 12, bottom: -1, height: 2,
              background: active ? "var(--accent-bed)" : "transparent",
              borderRadius: "2px 2px 0 0",
              transition: "background 120ms cubic-bezier(0.2,0.6,0.2,1)",
            }}/>
          </button>
        );
      })}
    </div>
  );
}

// ─── Sun-category visual cue (small icon + label) ──────────────
function PCSunCategoryGlyph({ value, size = 14 }) {
  // Three states: full sol / halv / skugga. We don't enumerate beyond that.
  const isFull = /full sol/i.test(value || "");
  const isHalf = /halvskugga/i.test(value || "");
  const fill = isFull ? "var(--sun-500)" : isHalf ? "var(--sun-300)" : "var(--wall-300)";
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" style={{ flexShrink: 0 }}>
      <circle cx="12" cy="12" r="4" fill={fill}/>
      {isFull && (
        <g stroke={fill} strokeWidth="1.5" strokeLinecap="round">
          <path d="M12 3v2"/><path d="M12 19v2"/>
          <path d="M3 12h2"/><path d="M19 12h2"/>
          <path d="m5.6 5.6 1.4 1.4"/><path d="m17 17 1.4 1.4"/>
          <path d="m5.6 18.4 1.4-1.4"/><path d="M17 7l1.4-1.4"/>
        </g>
      )}
      {isHalf && (
        <g stroke="var(--wall-500)" strokeWidth="1.5" strokeLinecap="round">
          <path d="M12 3v2"/><path d="M3 12h2"/><path d="m5.6 5.6 1.4 1.4"/>
        </g>
      )}
    </svg>
  );
}

Object.assign(window, {
  PCButton, PCSectionTitle, PCRow, PCChip, PCCategoryBadge, PCRangeBar, PCPlantThumb, PCTabBar, PCSunCategoryGlyph,
});

  <script type="text/babel" data-presets="react" data-source="catalog">
// PlantCatalog — main "Växter" tab.
// Master-detail split: left list (320px), right detail panel.

const { useState: csUseState, useMemo: csUseMemo, useRef: csUseRef, useEffect: csUseEffect } = React;

// ─── Stats helpers ─────────────────────────────────────────────
function plantedSummary(plantId, beds) {
  let bedCount = 0;
  let total = 0;
  for (const b of beds) {
    if (!b.plants) continue;
    const hits = b.plants.filter((p) => p.plantId === plantId);
    if (hits.length > 0) {
      bedCount += 1;
      total += hits.reduce((s, p) => s + p.count, 0);
    }
  }
  return { bedCount, total };
}

function firstBedFor(plantId, beds) {
  return beds.find((b) => b.plants && b.plants.some((p) => p.plantId === plantId));
}

// ─── Left list row ─────────────────────────────────────────────
function PlantRow({ plant, badge, active, dim, onClick, dense }) {
  const tint = window.PC_CATEGORY_TINT[plant.category] || window.PC_CATEGORY_TINT.vegetable;
  const padY = dense ? 6 : 9;
  return (

// ─── Filter dropdown — single-select chip-toggle group ─────────
function FilterStrip({ label, value, options, onChange }) {

// ─── Add-to-bed dropdown ────────────────────────────────────────
function AddToBedDropdown({ beds, disabled, onSelect }) {
  const [open, setOpen] = csUseState(false);

  csUseEffect(() => {
    if (!open) return;
    const handler = (e) => {
      if (ref.current && !ref.current.contains(e.target)) setOpen(false);

  return (
    <div style={{ position: "relative" }} ref={ref}>

        variant="secondary"
        disabled={disabled}

                {plant.sunCategory || "—"}
              </span>
            } mono={false}/>
            <div style={{ paddingTop: 10 }}>
              <div style={{ fontSize: 12.5, color: "var(--ink-2)", marginBottom: 2 }}>
                Ljusintervall
              </div>
              <PCRangeBar
                min={plant.light.minLux} max={plant.light.maxLux}
                scaleMin={0} scaleMax={60000}
                unit=" lux"
                format={(n) => window.fmtInt(n)}
                accent="var(--accent-sun)"
              />
            </div>
          </Section>

          {/* Temperatur */}
          <Section icon={<IconThermometer size={13}/>} title="Temperatur">
            <PCRow label="Klarar" value={<>{plant.temperature.minC} – {plant.temperature.maxC} °C</>}/>
            <div style={{ paddingTop: 6 }}>
              <PCRangeBar
                min={plant.temperature.minC} max={plant.temperature.maxC}
                scaleMin={-10} scaleMax={45}
                unit=" °C"
                format={(n) => String(n)}
                accent="var(--accent-soil)"
              />
            </div>
          </Section>

          {/* Vatten & jord */}
          <Section icon={<IconDroplet size={13}/>} title="Vatten & jord">
            <PCRow label="Vattning" value={plant.waterFrequency || "—"} mono={false}/>
            <PCRow label="Jordtyp" value={plant.soilTypes ? plant.soilTypes.join(", ") : "—"} mono={false}/>
            <PCRow label="Jordfukt" value={<>{plant.soilMoisture.minPct} – {plant.soilMoisture.maxPct} %</>}/>
            <div style={{ paddingTop: 6 }}>
              <PCRangeBar
                min={plant.soilMoisture.minPct} max={plant.soilMoisture.maxPct}
                scaleMin={0} scaleMax={100}
                unit=" %"
                format={(n) => String(n)}
                accent="var(--accent-sky)"
              />
            </div>
          </Section>

          {/* Näring */}
          <Section icon={<IconFlask size={13}/>} title="Näring">
            <PCRow label="EC-värde" value={<>{window.fmtInt(plant.nutrientEC.minMicroS)} – {window.fmtInt(plant.nutrientEC.maxMicroS)} µS/cm</>}/>
            <div style={{
              fontSize: 12, color: "var(--ink-2)", lineHeight: 1.5,
              marginTop: 6, fontStyle: "italic",
            }}>
              {ecLabel(plant.nutrientEC.maxMicroS)}
            </div>
          </Section>

          {/* Luftfuktighet */}
          <Section icon={<IconWind size={13}/>} title="Luftfuktighet">
            <PCRow label="Intervall" value={<>{plant.humidity.minPct} – {plant.humidity.maxPct} %</>}/>
            <div style={{ paddingTop: 6 }}>
              <PCRangeBar
                min={plant.humidity.minPct} max={plant.humidity.maxPct}
                scaleMin={0} scaleMax={100}
                unit=" %"
                format={(n) => String(n)}
                accent="var(--accent-sky)"
              />
            </div>
          </Section>

          {/* Odlingstips */}
          <Section icon={<IconSprout size={13}/>} title="Odlingstips">
            {plant.sowingMethod && (
              <PCRow label="Sådd" value={plant.sowingMethod} mono={false}/>
            )}
            <PCRow label="Plantavstånd" value={plant.spreadMm ? <>{plant.spreadMm} <span style={{ color: "var(--ink-2)" }}>mm</span></> : "—"}/>
            <PCRow label="Radavstånd" value={plant.rowSpacingMm ? <>{plant.rowSpacingMm} <span style={{ color: "var(--ink-2)" }}>mm</span></> : "—"}/>
            <PCRow label="Dagar till skörd" value={plant.daysToMaturity ? <>{plant.daysToMaturity} <span style={{ color: "var(--ink-2)" }}>dagar</span></> : "—"}/>
          </Section>

          {/* I min trädgård */}
          {(isPlanted || isPlanned) && (
            <Section icon={<IconMapPin size={13}/>} title="I min trädgård" accent>
              {isPlanted ? (
                <>
                  <div style={{
                    fontSize: 14, color: "var(--ink-1)",
                    lineHeight: 1.55, marginBottom: 12,
                  }}>
                    Planterad i <strong style={{ fontWeight: 600 }}>{summary.bedCount}</strong>{" "}
                    {summary.bedCount === 1 ? "bädd" : "bäddar"}, totalt{" "}
                    <span style={{ fontFamily: "var(--font-mono)", fontVariantNumeric: "tabular-nums", fontWeight: 600 }}>{summary.total}</span>{" "}
                    st.
                  </div>
                  <PCButton variant="primary" onClick={() => onShowOnCanvas(plant.id)}>
                    Visa på canvas <IconArrowRight size={13}/>
                  </PCButton>
                </>
              ) : (
                <div style={{
                  fontSize: 14, color: "var(--ink-1)",
                  fontStyle: "italic", lineHeight: 1.55,
                }}>
                  Planerad — inte placerad i någon bädd ännu.
                </div>
              )}
            </Section>
          )}
        </div>
      </div>
    </div>
  );
}

// EC level → plain-language label (matches design-system "calm voice")
function ecLabel(maxEC) {
  if (maxEC < 1000) return "Låg till medel näring.";
  if (maxEC < 1800) return "Medelhög näring.";
  if (maxEC < 2500) return "Medelhög till hög näring — kräver regelbunden gödsling.";
  return "Hög näring — tung mat.";
}

function Section({ icon, title, accent, children }) {
  return (
    <section style={{
      padding: accent ? "16px 18px" : 0,
      background: accent ? "var(--bed-100)" : "transparent",
      border: accent ? "1px solid var(--line-1)" : "none",
      borderRadius: accent ? 8 : 0,
    }}>
      <PCSectionTitle icon={icon}>{title}</PCSectionTitle>
      <div style={{
        borderTop: accent ? "none" : "1px solid var(--line-1)",
        paddingTop: accent ? 0 : 4,
      }}>
        {children}
      </div>
    </section>
  );
}

// ─── Empty state for detail panel ──────────────────────────────
function DetailEmptyState() {
  return (
    <div style={{
      flex: 1,
      display: "flex", alignItems: "center", justifyContent: "center",
      background: "var(--bg-surface)",
    }}>
      <div style={{ textAlign: "center", maxWidth: 360, padding: 32, color: "var(--ink-2)" }}>
        <div style={{
          width: 80, height: 80, margin: "0 auto 16px",
          borderRadius: 16,
          background: "var(--bed-100)",
          color: "var(--bed-700)",
          display: "flex", alignItems: "center", justifyContent: "center",
          border: "1px solid var(--line-1)",
        }}>
          <IconLeaf size={36}/>
        </div>
        <div style={{
          fontFamily: "var(--font-display)",
          fontSize: 22, color: "var(--ink-1)",
          letterSpacing: "-0.01em", lineHeight: 1.2,
          marginBottom: 8, fontWeight: 500,
        }}>
          Välj en växt i listan
        </div>
        <div style={{
          fontSize: 13.5, color: "var(--ink-2)", lineHeight: 1.55,
        }}>
          Här visas detaljer om sol, jord, näring och odlingstips. Sök eller bläddra
          i listan till vänster för att börja.
        </div>
      </div>
    </div>
  );
}

// ─── Catalog tab (the main work) ───────────────────────────────
function PCCatalogTab({
  plants, beds, plantsById,
  selectedPlantId, onSelectPlant,
  plannedIds, onTogglePlan, onAddToBed, onShowOnCanvas,
  dense,
}) {
  const [query, setQuery] = csUseState("");
  const [categoryFilter, setCategoryFilter] = csUseState("all");
  const [sunFilter, setSunFilter] = csUseState("all");

  const planned = csUseMemo(() => new Set(plannedIds), [plannedIds]);

  // "Mina växter" — those that appear in any bed
  const inGardenIds = csUseMemo(() => {
    const s = new Set();
    for (const b of beds) {
      if (!b.plants) continue;
      for (const p of b.plants) s.add(p.plantId);
    }
    return s;
  }, [beds]);

  const myPlants = csUseMemo(() => {
    return plants
      .filter((p) => inGardenIds.has(p.id))
      .map((p) => ({ plant: p, summary: plantedSummary(p.id, beds) }))
      .sort((a, b) => a.plant.commonName.localeCompare(b.plant.commonName, "sv"));
  }, [plants, beds, inGardenIds]);

  const plannedOnly = csUseMemo(() => {
    return plants
      .filter((p) => planned.has(p.id) && !inGardenIds.has(p.id))
      .sort((a, b) => a.plant?.commonName ? 0 : a.commonName.localeCompare(b.commonName, "sv"));
  }, [plants, planned, inGardenIds]);

  // Filtered list (search + filters)
  const filteredAll = csUseMemo(() => {
    const q = query.trim().toLowerCase();
    return plants.filter((p) => {
      if (categoryFilter !== "all" && p.category !== categoryFilter) return false;
      if (sunFilter !== "all") {
        const s = (p.sunCategory || "").toLowerCase();
        if (sunFilter === "full" && !/full sol/.test(s)) return false;
        if (sunFilter === "half" && !/halvskugga/.test(s)) return false;
        if (sunFilter === "shade" && /full sol|halvskugga/.test(s)) return false;
      }
      if (q && q.length >= 2) {
        const haystack = [p.commonName, p.commonNameEn, p.scientificName].join(" ").toLowerCase();
        if (!haystack.includes(q)) return false;
      }
      return true;
    }).sort((a, b) => a.commonName.localeCompare(b.commonName, "sv"));
  }, [plants, query, categoryFilter, sunFilter]);

  const selectedPlant = plants.find((p) => p.id === selectedPlantId);

  return (
    <div style={{ display: "flex", flex: 1, minHeight: 0 }}>

      {/* ─── Left: list ─── */}
      <aside style={{
        width: 320, flexShrink: 0,
        background: "var(--bg-surface)",
        borderRight: "1px solid var(--line-1)",
        display: "flex", flexDirection: "column",
        minHeight: 0,
      }}>
        {/* Mina växter */}
        <div style={{ padding: "16px 0 8px" }}>
          <div style={{ padding: "0 18px", display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 4 }}>
            <div style={{
              fontSize: 11.5, color: "var(--ink-2)",
              textTransform: "uppercase", letterSpacing: "0.08em", fontWeight: 500,
            }}>Mina växter</div>
            <div style={{
              fontFamily: "var(--font-mono)", fontSize: 11, color: "var(--ink-3)",
              fontVariantNumeric: "tabular-nums",
            }}>{myPlants.length} st</div>
          </div>
          {myPlants.length === 0 ? (
            <div style={{ padding: "8px 18px 4px", fontSize: 12.5, color: "var(--ink-2)", lineHeight: 1.5, fontStyle: "italic" }}>
              Inga växter i bäddar ännu.
            </div>
          ) : (
            myPlants.map(({ plant, summary }) => (
              <PlantRow
                key={plant.id}
                plant={plant}
                badge={`×${summary.total}`}
                active={plant.id === selectedPlantId}
                onClick={() => onSelectPlant(plant.id)}
                dense={dense}
              />
            ))
          )}
        </div>

        {/* Planerade */}
        {plannedOnly.length > 0 && (
          <div style={{ padding: "10px 0 8px", borderTop: "1px dashed var(--line-1)" }}>
            <div style={{ padding: "0 18px", display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 4 }}>
              <div style={{
                fontSize: 11.5, color: "var(--ink-2)",
                textTransform: "uppercase", letterSpacing: "0.08em", fontWeight: 500,
              }}>Planerade</div>
              <div style={{
                fontFamily: "var(--font-mono)", fontSize: 11, color: "var(--ink-3)",
                fontVariantNumeric: "tabular-nums",
              }}>{plannedOnly.length} st</div>
            </div>
            {plannedOnly.map((plant) => (
              <PlantRow
                key={plant.id}
                plant={plant}
                badge={"·"}
                dim
                active={plant.id === selectedPlantId}
                onClick={() => onSelectPlant(plant.id)}
                dense={dense}
              />
            ))}
          </div>
        )}

        {/* Search + filters */}
        <div style={{
          padding: "12px 14px 10px",
          borderTop: "1px solid var(--line-1)",
          background: "var(--bg-surface)",
          display: "flex", flexDirection: "column", gap: 8,
        }}>
          {/* Search input */}
          <div style={{ position: "relative" }}>
            <span style={{
              position: "absolute", left: 9, top: "50%", transform: "translateY(-50%)",
              color: "var(--ink-2)", display: "inline-flex",
            }}><IconSearch size={14}/></span>
            <input
              type="text"
              value={query}
              onChange={(e) => setQuery(e.target.value)}
              placeholder="Sök växt..."
              data-pp-input="catalog-search"
              style={{
                width: "100%",
                height: 32,
                padding: "0 30px 0 30px",
                background: "var(--bg-paper)",
                border: "1px solid var(--line-1)",
                borderRadius: 4,
                fontFamily: "var(--font-sans)",
                fontSize: 13,
                color: "var(--ink-1)",
                outline: "none",
                transition: "border-color 120ms",
              }}
              onFocus={(e) => e.target.style.borderColor = "var(--ink-1)"}
              onBlur={(e) => e.target.style.borderColor = "var(--line-1)"}
            />
            {query && (
              <button
                onClick={() => setQuery("")}
                title="Rensa sökning"
                style={{
                  position: "absolute", right: 6, top: "50%", transform: "translateY(-50%)",
                  width: 22, height: 22, padding: 0,
                  background: "transparent", border: "none", cursor: "pointer",
                  color: "var(--ink-2)", display: "inline-flex", alignItems: "center", justifyContent: "center",
                  borderRadius: 4,
                }}
                onMouseEnter={(e) => { e.currentTarget.style.background = "var(--bg-hover)"; }}
                onMouseLeave={(e) => { e.currentTarget.style.background = "transparent"; }}
              >
                <IconX size={14}/>
              </button>
            )}
          </div>

          {/* Filter chips — category */}
          <div>
            <div style={{
              fontSize: 10.5, color: "var(--ink-2)",
              textTransform: "uppercase", letterSpacing: "0.08em", fontWeight: 500,
              marginBottom: 5,
            }}>Typ</div>
            <FilterStrip
              value={categoryFilter}
              onChange={setCategoryFilter}
              options={[
                { value: "all", label: "Alla" },
                { value: "vegetable", label: "Grönsaker" },
                { value: "herb", label: "Kryddor" },
                { value: "berry", label: "Bär" },
                { value: "flower", label: "Blommor" },
              ]}
            />
          </div>

          {/* Filter chips — sun */}
          <div>
            <div style={{
              fontSize: 10.5, color: "var(--ink-2)",
              textTransform: "uppercase", letterSpacing: "0.08em", fontWeight: 500,
              marginBottom: 5,
            }}>Sol</div>
            <FilterStrip
              value={sunFilter}
              onChange={setSunFilter}
              options={[
                { value: "all", label: "Alla" },
                { value: "full", label: "Full sol" },
                { value: "half", label: "Halvskugga" },
                { value: "shade", label: "Skugga" },
              ]}
            />
          </div>
        </div>

        {/* All plants list */}
        <div style={{
          flex: 1, minHeight: 0,
          borderTop: "1px solid var(--line-1)",
          overflowY: "auto",
          display: "flex", flexDirection: "column",
        }}>
          <div style={{ padding: "12px 18px 6px", display: "flex", justifyContent: "space-between", alignItems: "baseline" }}>
            <div style={{
              fontSize: 11.5, color: "var(--ink-2)",
              textTransform: "uppercase", letterSpacing: "0.08em", fontWeight: 500,
            }}>Alla växter</div>
            <div style={{
              fontFamily: "var(--font-mono)", fontSize: 11, color: "var(--ink-3)",
              fontVariantNumeric: "tabular-nums",
            }}>{filteredAll.length} st</div>
          </div>
          {filteredAll.length === 0 ? (
            <div style={{ padding: "16px 18px", fontSize: 12.5, color: "var(--ink-2)", lineHeight: 1.55, fontStyle: "italic" }}>
              Inga växter matchar sökningen.
            </div>
          ) : (
            filteredAll.map((plant) => (
              <PlantRow
                key={plant.id}
                plant={plant}
                active={plant.id === selectedPlantId}
                onClick={() => onSelectPlant(plant.id)}
                dense={dense}
              />
            ))
          )}
          <div style={{ flex: 1 }}/>
        </div>
      </aside>

      {/* ─── Right: detail ─── */}
      {selectedPlant ? (
        <PlantDetailCard
          plant={selectedPlant}
          beds={beds}
          planned={planned}
          plantsById={plantsById}
          onTogglePlan={onTogglePlan}
          onAddToBed={onAddToBed}
          onShowOnCanvas={onShowOnCanvas}
        />
      ) : (
        <DetailEmptyState />
      )}
    </div>
  );
}

window.PCCatalogTab = PCCatalogTab;

</script>

    filter:drop-shadow(0 1px 1px rgba(0,0,0,.3))}

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', noDeckControls = false, children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  // Auto-inject a rail toggle when a <deck-stage> is on the page. The
  // toggle drives the deck's per-viewer _railVisible via window message;
  // state is mirrored from the same localStorage key the deck reads so
  // the control reflects reality across reloads. The mechanism is the
  // message — authors who want custom placement can post it directly
  // and pass noDeckControls to suppress this one.
  const hasDeckStage = React.useMemo(
    () => typeof document !== 'undefined' && !!document.querySelector('deck-stage'),
    [],
  );
  // deck-stage enables its rail in connectedCallback, but this panel can
  // mount before that element has upgraded. The initial read catches the
  // common case; the listener covers mounting first. (Older deck-stage.js
  // copies still wait for the host's __omelette_rail_enabled postMessage —
  // same listener handles those.)
  const [railEnabled, setRailEnabled] = React.useState(
    () => hasDeckStage && !!document.querySelector('deck-stage')?._railEnabled,
  );
  React.useEffect(() => {
    if (!hasDeckStage || railEnabled) return undefined;
    const onMsg = (e) => {
      if (e.data && e.data.type === '__omelette_rail_enabled') setRailEnabled(true);
    };
    window.addEventListener('message', onMsg);
    return () => window.removeEventListener('message', onMsg);
  }, [hasDeckStage, railEnabled]);
  const [railVisible, setRailVisible] = React.useState(() => {
    try { return localStorage.getItem('deck-stage.railVisible') !== '0'; } catch (e) { return true; }
  });
  const toggleRail = (on) => {
    setRailVisible(on);
    window.postMessage({ type: '__deck_rail_visible', on }, '*');
  };
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-noncommentable=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
          {hasDeckStage && railEnabled && !noDeckControls && (
            <TweakSection label="Deck">
              <TweakToggle label="Thumbnail rail" value={railVisible} onChange={toggleRail} />
            </TweakSection>
          )}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

</script>
  <script type="text/babel" data-presets="react" data-source="app">
// PlantCatalog — top-level App.
// Two tabs (Planera / Växter), Tweaks integration, theme handling.

const { useReducer: aUseReducer, useState: aUseState, useMemo: aUseMemo, useEffect: aUseEffect } = React;

// ─── State reducer ─────────────────────────────────────────────
function appReducer(state, action) {
  switch (action.type) {
    case "switchTab":
      return { ...state, activeTab: action.tab };

    case "selectPlant":
      return { ...state, selectedPlantId: action.plantId };

    case "selectBed":
      return { ...state, selectedBedId: action.bedId };

    case "togglePlan": {
      const next = new Set(state.plannedPlantIds);
      if (next.has(action.plantId)) next.delete(action.plantId);
      else next.add(action.plantId);
      return { ...state, plannedPlantIds: Array.from(next) };
    }

    case "addPlantToBed": {
      const { plantId, bedId } = action;
      const plant = window.PC_PLANTS.find((p) => p.id === plantId);
      if (!plant) return state;

      // Remove from plannedPlantIds since it's now in a bed
      const planned = state.plannedPlantIds.filter((id) => id !== plantId);

      const beds = state.beds.map((b) => {
        if (b.id !== bedId) return b;
        const existing = (b.plants || []).find((p) => p.plantId === plantId);
        if (existing) {
          // Increment count rather than add a duplicate placement
          return {
            ...b,
            plants: b.plants.map((p) =>
              p.plantId === plantId ? { ...p, count: p.count + 1 } : p
            ),
          };
        }
        const placementId = `place-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`;
        return {
          ...b,
          plants: [...(b.plants || []), {
            placementId,
            plantId,
            displayName: plant.commonName,
            offsetX: 0, offsetY: 0,
            count: 1,
          }],
        };
      });
      return { ...state, beds, plannedPlantIds: planned };
    }

    case "showOnCanvas": {
      const { plantId } = action;
      const bed = state.beds.find((b) => b.plants && b.plants.some((p) => p.plantId === plantId));
      return {
        ...state,
        activeTab: "planera",
        selectedBedId: bed ? bed.id : state.selectedBedId,
      };
    }

    default:
      return state;
  }
}

// ─── App shell ─────────────────────────────────────────────────
function App() {
  // Tweak defaults — wrapped in EDITMODE markers so the host can persist.
  const tweakDefaults = /*EDITMODE-BEGIN*/{
    "theme": "light",
    "density": "comfortable",
    "iconStyle": "lucide"
  }/*EDITMODE-END*/;
  const [tweaks, setTweak] = useTweaks(tweakDefaults);

  const [state, dispatch] = aUseReducer(appReducer, {
    activeTab: "vaxter",                // start in PlantCatalog (the new work)
    selectedPlantId: "solanum-lycopersicum", // pre-select Tomat so the card is visible
    selectedBedId: "rect-1",
    beds: window.PC_BEDS,
    plannedPlantIds: window.PC_INITIAL_PLANNED,
  });

  // Theme — drive [data-theme="dark"] on <html>
  aUseEffect(() => {
    if (tweaks.theme === "dark") {
      document.documentElement.setAttribute("data-theme", "dark");
    } else {
      document.documentElement.removeAttribute("data-theme");
    }
  }, [tweaks.theme]);

  const plantsById = aUseMemo(() => {
    const m = {};
    for (const p of window.PC_PLANTS) m[p.id] = p;
    return m;
  }, []);

  const dense = tweaks.density === "compact";

  return (
    <div
      className="pp"
      style={{
        display: "flex", flexDirection: "column",
        height: "100vh",
        background: "var(--bg-paper)",
        color: "var(--ink-1)",
      }}
    >
      {/* ─── Top bar ─── */}
      <header style={{
        flexShrink: 0,
        height: 56,
        background: "var(--bg-surface)",
        borderBottom: "1px solid var(--line-1)",
        display: "flex",
        alignItems: "stretch",
      }}>
        {/* Brand */}
        <div style={{
          display: "flex", alignItems: "center", gap: 10,
          padding: "0 18px",
          borderRight: "1px solid var(--line-1)",
          flexShrink: 0,
        }}>
          <img src="data:image/svg+xml;utf8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2048%2048%22%20width%3D%2248%22%20height%3D%2248%22%20fill%3D%22none%22%3E%0A%20%20%3Crect%20x%3D%224%22%20y%3D%224%22%20width%3D%2240%22%20height%3D%2240%22%20rx%3D%223%22%20stroke%3D%22%231F2419%22%20stroke-width%3D%222%22%20stroke-dasharray%3D%225%204%22%20fill%3D%22none%22%3E%3C%2Frect%3E%0A%20%20%3Crect%20x%3D%229%22%20y%3D%229%22%20width%3D%2217%22%20height%3D%2211%22%20rx%3D%221.5%22%20fill%3D%22%236E8C5A%22%3E%3C%2Frect%3E%0A%20%20%3Crect%20x%3D%229%22%20y%3D%2223%22%20width%3D%2211%22%20height%3D%2216%22%20rx%3D%221.5%22%20fill%3D%22%236E8C5A%22%20opacity%3D%220.65%22%3E%3C%2Frect%3E%0A%20%20%3Crect%20x%3D%2223%22%20y%3D%2223%22%20width%3D%2216%22%20height%3D%2216%22%20rx%3D%221.5%22%20fill%3D%22%23B5562E%22%20opacity%3D%220.9%22%3E%3C%2Frect%3E%0A%3C%2Fsvg%3E" alt="" style={{ height: 24, display: "block" }} />
          <div style={{ display: "flex", flexDirection: "column", lineHeight: 1.1 }}>
            <strong style={{
              fontFamily: "var(--font-display)", fontSize: 17,
              color: "var(--ink-1)", fontWeight: 500, letterSpacing: "-0.01em",
            }}>PlotPlaner</strong>
            <span style={{
              fontSize: 10.5, color: "var(--ink-2)",
              textTransform: "uppercase", letterSpacing: "0.08em", fontWeight: 500,
            }}>Koloniträdgård</span>
          </div>
        </div>

        {/* Tabs */}
        <div style={{ display: "flex", alignItems: "stretch", borderRight: "1px solid var(--line-1)" }}>
          <PCTabBar
            tabs={[
              { id: "planera", label: "Planera", icon: <IconGrid size={14}/> },
              { id: "vaxter", label: "Växter", icon: <IconLeaf size={14}/> },
            ]}
            value={state.activeTab}
            onChange={(t) => dispatch({ type: "switchTab", tab: t })}
          />
        </div>

        {/* Spacer */}
        <div style={{ flex: 1 }}/>

        {/* Tab-specific summary */}
        <div style={{
          display: "flex", alignItems: "center", gap: 14,
          padding: "0 18px",
          fontSize: 12, color: "var(--ink-2)",
          fontFamily: "var(--font-mono)",
        }}>
          {state.activeTab === "planera" ? (
            <>
              <span><span style={{ color: "var(--ink-1)" }}>{state.beds.length}</span> bäddar</span>
              <span style={{ width: 1, height: 14, background: "var(--line-1)" }}/>
              <span>Lat 55,87° N · Lon 12,83° E</span>
            </>
          ) : (
            <>
              <span>
                <span style={{ color: "var(--ink-1)" }}>{window.PC_PLANTS.length}</span> växter
              </span>
              <span style={{ width: 1, height: 14, background: "var(--line-1)" }}/>
              <span>
                <span style={{ color: "var(--ink-1)" }}>{state.plannedPlantIds.length}</span> planerade
              </span>
            </>
          )}
        </div>

        {/* Theme toggle */}
        <div style={{ display: "flex", alignItems: "center", padding: "0 12px", borderLeft: "1px solid var(--line-1)" }}>
          <button
            onClick={() => setTweak("theme", tweaks.theme === "dark" ? "light" : "dark")}
            title={tweaks.theme === "dark" ? "Byt till dagläge" : "Byt till kvällsläge"}
            style={{
              height: 32, width: 32, padding: 0,
              background: "transparent",
              border: "1px solid var(--line-1)",
              borderRadius: 4,
              color: "var(--ink-1)",
              cursor: "pointer",
              display: "inline-flex", alignItems: "center", justifyContent: "center",
              transition: "background 120ms cubic-bezier(0.2,0.6,0.2,1)",
            }}
            onMouseEnter={(e) => { e.currentTarget.style.background = "var(--bg-hover)"; }}
            onMouseLeave={(e) => { e.currentTarget.style.background = "transparent"; }}
          >
            {tweaks.theme === "dark" ? <IconSun size={14}/> : <IconMoon size={14}/>}
          </button>
        </div>
      </header>

      {/* ─── Active tab ─── */}
      {state.activeTab === "planera" ? (
        <PCPlaneraTab
          beds={state.beds}
          plot={window.PC_PLOT}
          selectedBedId={state.selectedBedId}
          onSelectBed={(id) => dispatch({ type: "selectBed", bedId: id })}
          plantsById={plantsById}
        />
      ) : (
        <PCCatalogTab
          plants={window.PC_PLANTS}
          beds={state.beds}
          plantsById={plantsById}
          selectedPlantId={state.selectedPlantId}
          onSelectPlant={(id) => dispatch({ type: "selectPlant", plantId: id })}
          plannedIds={state.plannedPlantIds}
          onTogglePlan={(id) => dispatch({ type: "togglePlan", plantId: id })}
          onAddToBed={(plantId, bedId) => dispatch({ type: "addPlantToBed", plantId, bedId })}
          onShowOnCanvas={(plantId) => dispatch({ type: "showOnCanvas", plantId })}
          dense={dense}
        />
      )}

      {/* ─── Tweaks panel ─── */}
      <TweaksPanel title="Tweaks">
        <TweakSection label="Utseende">
          <TweakRadio
            label="Tema"
            value={tweaks.theme}
            options={[
              { value: "light", label: "Paper" },
              { value: "dark", label: "Evening" },
            ]}
            onChange={(v) => setTweak("theme", v)}
          />
          <TweakRadio
            label="Listdensitet"
            value={tweaks.density}
            options={[
              { value: "comfortable", label: "Luftig" },
              { value: "compact", label: "Kompakt" },
            ]}
            onChange={(v) => setTweak("density", v)}
          />
        </TweakSection>
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>
</body>
</html>
